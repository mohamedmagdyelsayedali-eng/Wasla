<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وصلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF5FF;--ink:#0A2A6B;--mut:#4A5F8A;--card:#fff;--blue:#0B4FD8;--sky:#11A9FF;--or:#FF9A0F;--orink:#1F1300;--sh:0 10px 28px rgba(11,79,216,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071533;--ink:#EAF1FF;--mut:#A9BBE0;--card:#0F2552;--sh:0 10px 28px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#071533;--ink:#EAF1FF;--mut:#A9BBE0;--card:#0F2552;--sh:0 10px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Tajawal','Segoe UI',Tahoma,sans-serif;min-height:100vh;overflow-x:hidden}
.w{max-width:460px;margin:0 auto;padding:20px 16px 28px}
header{text-align:center}
.ic{width:104px;height:104px;border-radius:28px;box-shadow:var(--sh);display:block;margin:0 auto 6px}
h1{margin:0;font-size:2.6rem;font-weight:900;line-height:1.2;color:var(--blue)}
.en{font-size:.85rem;font-weight:700;color:var(--or);letter-spacing:.35em;margin:0}
.sl{margin:6px 0 0;font-weight:700;color:var(--mut);font-size:1.05rem}
.q{margin:22px 4px 12px;font-weight:900;font-size:1.25rem}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border-radius:26px;box-shadow:var(--sh);overflow:hidden;margin-bottom:16px;transition:transform .15s}
.card:active{transform:scale(.985)}.card:focus-visible{outline:3px solid var(--or);outline-offset:3px}
.card img{display:block;width:100%;height:178px;object-fit:cover;object-position:center 30%}
.b{padding:14px 18px 18px}
.b h2{margin:0;font-size:2.1rem;font-weight:900;line-height:1.2}
.b p{margin:6px 0 14px;color:var(--mut);font-weight:500;line-height:1.7;font-size:1rem}
.btn{display:block;text-align:center;padding:14px;border-radius:16px;font-weight:900;font-size:1.1rem;min-height:52px}
.c1 .btn{background:var(--blue);color:#fff}.c1 h2{color:var(--blue)}
.c2 .btn{background:var(--or);color:var(--orink)}.c2 h2{color:var(--or)}
.c2{border-top:5px solid var(--or)}.c1{border-top:5px solid var(--blue)}
.ft{text-align:center;color:var(--mut);font-size:.85rem;margin-top:8px}
#p{display:none;text-align:center;padding-top:40px}
#p h2{font-size:2rem;margin:0 0 10px}#p p{color:var(--mut);line-height:1.8}
#p a{display:inline-block;margin-top:18px;padding:12px 26px;border-radius:14px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900}

#p{padding-top:8px;text-align:right}#p h2{font-size:1.8rem;margin:6px 0 12px;text-align:center}
.bk{background:none;border:0;color:var(--blue);font:700 1rem inherit;font-family:inherit;padding:10px 0;cursor:pointer}
.pn{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:18px}
label{display:block;font-weight:700;margin:12px 0 6px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=file],select{width:100%;padding:13px;border-radius:14px;border:2px solid #b9c9ea;background:var(--bg);color:var(--ink);font:500 1rem inherit;font-family:inherit}
input[dir=ltr]{text-align:left}
.ck{display:flex;gap:10px;align-items:center;font-weight:500;margin:8px 0}.ck input{width:22px;height:22px}
.ar{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
button.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:16px;background:var(--blue);color:#fff;font:900 1.1rem inherit;font-family:inherit;min-height:52px;cursor:pointer}
button.go:disabled{opacity:.5}
.ms{margin-top:12px;padding:12px;border-radius:12px;font-weight:700;line-height:1.7}
.er{background:#ffe3e3;color:#8a1111}.ok{background:#dff6e5;color:#0d5a24}.nt{background:#fff3d6;color:#6b4300}
.wa{margin-top:8px;padding:12px;border-radius:12px;background:var(--card);border:2px solid var(--blue);line-height:2.2}.wn{font-size:.85em;color:var(--mut);font-weight:700;margin-bottom:6px;line-height:1.7}.wc{display:inline-block;margin:3px;padding:3px 12px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:.9em}
.lo{background:none;border:0;color:var(--mut);font-family:inherit;font-weight:700;margin-top:14px;cursor:pointer}
.pw{position:relative}.pw input{padding-right:52px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;font-size:1.4rem;cursor:pointer}
.pp #h{display:none}.pp #p{display:block}
.cr{border:2px solid #b9c9ea;border-radius:16px;padding:12px;margin:12px 0;line-height:1.8}.dl{display:flex;flex-wrap:wrap;gap:4px 14px}.cr .rs{margin:8px 0}.ac{display:flex;gap:8px}.ac button{flex:1;padding:12px;border:0;border-radius:12px;font:900 .95rem inherit;font-family:inherit;cursor:pointer;color:#fff}
.vid{width:min(250px,72%);aspect-ratio:1;margin:14px auto 16px;border-radius:26px;overflow:hidden;box-shadow:var(--sh);background:var(--card)}.vid video{display:block;width:100%;height:100%;object-fit:cover;object-position:57% center}.vid{position:fixed;inset:0;width:auto;aspect-ratio:auto;margin:0;border-radius:0;box-shadow:none;background:#0A2A6B;z-index:-1}.vid::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,24,64,.62) 0%,rgba(6,24,64,.30) 38%,rgba(6,24,64,.22) 62%,rgba(6,24,64,.30) 100%)}#h header h1,#h header .sl,#h .q,#h .ft{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}#h .q{margin:0 4px 8px;font-size:1.05rem}body:not(.pp) #h{display:flex;flex-direction:column;min-height:calc(100vh - 48px);min-height:calc(100svh - 48px)}body:not(.pp) #h header{margin-bottom:12px}body:not(.pp) #h .q{margin-top:auto}#h .card{margin-bottom:8px}#h .b{padding:8px 14px 10px}#h .b h2{font-size:1.45rem}#h .b p{margin:3px 0 8px;font-size:.84rem;line-height:1.45}#h .btn{padding:7px;min-height:40px}#h .ft{margin-top:2px;font-size:.8rem}@media (max-height:700px){#h h1{font-size:2.1rem}#h .sl{font-size:.92rem;margin-top:2px}#h .en{font-size:.75rem}#h .b{padding:6px 12px 8px}#h .b h2{font-size:1.3rem}#h .b p{font-size:.78rem;margin:2px 0 6px}#h .btn{min-height:36px;padding:5px;font-size:.95rem}#h .q{font-size:.95rem;margin-bottom:6px}}#h .card{margin-bottom:10px;border-radius:20px;border-top-width:4px}#h .b{padding:9px 14px 12px}#h .b h2{font-size:1.55rem;line-height:1.25}#h .b p{margin:4px 0 9px;font-size:.88rem;line-height:1.5}#h .btn{padding:8px;min-height:42px;font-size:1rem;border-radius:13px}
.sc{border:2px solid;border-radius:16px;padding:0 14px 14px;margin:18px 0 10px;overflow:hidden}.sc .sh{margin:0 -14px 6px;padding:11px 14px;font-weight:800;font-size:1.08rem;line-height:1.35}.sc .sh small{display:block;font-size:.76rem;font-weight:600;opacity:.9;margin-top:2px}.sp{border-color:var(--blue);background:rgba(11,79,216,.06)}.sp .sh{background:var(--blue);color:#fff}.sd{border-color:var(--or);background:rgba(255,154,14,.09)}.sd .sh{background:var(--or);color:#1F1300}@keyframes blk{50%{opacity:0}}.sl.tw::after{content:"";display:inline-block;width:2px;height:1em;background:currentColor;margin-inline-start:3px;vertical-align:-.15em;animation:blk .8s steps(1) infinite}.hn{font-size:.84rem;color:var(--mut);line-height:1.7;margin:8px 2px 4px}.hn b{color:var(--ink)}</style><link rel="icon" type="image/png" sizes="64x64" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABABAMAAABYR2ztAAAAMFBMVEX///79/f7a5/1dlvkLYvYBXfYBXPYAXPcAXPYAXPUBW/YAW/cAW/YAW/UBV/YAUPXUsNSSAAAGgklEQVR42jWVW2wc1QGGv3Pm2I4d2D3rJG0Bxzts0rRSEnsTu2ormTCGARWpykVKQx9omiBKQ4QQgRRE81gJEA9cKrWQNLQRt7QoLRug9OJJcmyM2qpxvAQFREuc2cSmPMSeMzYUbJ+d6QP0e/5evpf/F0PAYq3UWO8BhBFfUC8nLVsBCSzWKo31dbBwBUDQHKuP0ags1j4X8tqaoNnWNw3B9o9pwmjgU6Wn5fZFCxIur/kufS64GC/nWDR5I3W8ZVVvfeuiKZ8CST4CT6IQ/oCBq0eDqjOo4EYHXpdF4u4YqFEPqCoAGUBAggJQtxrE0PFdUb1HqgFDoCIgk+SpVm5ylzNq4RtyEahKnApRUfBFl1aDYRdYqEm1C0JCIIiA82cmwsBaNwTRKzpoDaTFYYiCyChuyMYe+mVyRG3T1FEhiuCUt6zHkBFmq2O/Ig///J4Xnv/twEm4jepn/8kmLv5Q7FnpJUWpAoCO9u0zaekf965rvrMfiPK3qwXlg25xDjh5wzPnxmDmW8Nzr/gRzbYwgtTb0EFml2w6VSldvdDxe9He3v7Re3/7UgfNd1aMf/R16tIDT4cjkOT55gZJQmEq86jH/YP6DoJMPAoovv0k4r6jw418WXFcz1587QS0rSOMQN00pByDZ18m3+lZ5hI2NHJ93a2aD58PAcRpzIBp7txiO4+bA7b7m/bZonjhz1MX6Lp6P4vDKHCGWJ8h/tFjltJngYAXDq2zrMQpxoV0jmZ9X3ptqfAJYAlyuCJLS51HlxMN96BUFJzAO1C04lxJp1NvPHRJi4ODmrToG/CqkvCIxyttGyG5SjNz180XSJda8rW7Y2JAgR8Szvf8Rhe2lRqFeFOjeO18Qwtf7iK64STitBvFtdzy6Eia975e0GmvtZvmxknnzk1MOpSTzjgXACXEOVem0BCztRnoTE3sZvhAydyGisVa27AlaatYYfOBqQb52gc+QO24XjvZsj1CBa3+rKbw/ec0BdlatMhiB4G
